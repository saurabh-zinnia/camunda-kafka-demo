spring:
  datasource:
    url: jdbc:h2:mem:camunda-test-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
  h2:
    console:
      enabled: true

camunda.bpm:
  admin-user:
    id: demo
    password: demo
  filter.create: All Tasks
  database:
    schema-update: true
    type: h2
  history-level: full
  job-execution:
    enabled: true
  generic-properties:
      properties:
        historyCleanupStrategy: removalTimeBased
        historyRemovalTimeStrategy: end  # Base removal time on instance end time
        historyCleanupBatchWindowStartTime: "01:00"  # Off-peak hours
        historyCleanupBatchWindowEndTime: "05:00"
        historyCleanupBatchSize: 500     # Max instances per transaction
        historyCleanupDegreeOfParallelism: 4

kafka:
  bootstrap-address: localhost:9092
  group-id: someGroupId
  trusted-packages: org.camunda.bpm.demo.dto